
    <!-- Nhân Sự > Báo Cáo (9/2026) — DỜI từ view lồng bên trong Hồ Sơ Nhân Sự ra module con RIÊNG, ngang
         hàng Hồ Sơ Nhân Sự/Hợp Đồng Lao Động (theo phản hồi người dùng: không nên nằm lồng trong Hồ Sơ
         Nhân Sự). Không đổi route/logic — vẫn GET /api/hr-profile/reports, CẦN CẢ hrProfileManage LẪN
         hrContractManage/admin (vẫn lộ số liệu lương qua mục tăng lương, cùng mức chặt GET .../history)
         — xem hrpfCanViewReports() ở core.js, renderHrReportModule()/loadHrpfReports() ở module-hrprofile.js. -->
    <div class="flex flex-wrap items-end gap-2 bg-white border rounded-lg p-3">
      <div><label class="block text-[11px] font-semibold text-gray-500 mb-0.5">Từ ngày</label>
        <input type="date" id="hrpfReportFrom" class="border p-1.5 rounded text-xs"></div>
      <div><label class="block text-[11px] font-semibold text-gray-500 mb-0.5">Đến ngày</label>
        <input type="date" id="hrpfReportTo" class="border p-1.5 rounded text-xs"></div>
      <div><label class="block text-[11px] font-semibold text-gray-500 mb-0.5">Tình trạng HĐLĐ (lọc riêng danh sách hợp đồng)</label>
        <select id="hrpfReportContractStatus" class="border p-1.5 rounded text-xs bg-white">
          <option value="">— Tất cả —</option>
          <option value="DRAFT">📝 Nháp</option>
          <option value="ACTIVE">✅ Đang hiệu lực</option>
          <option value="EXPIRED">⌛ Hết hạn</option>
          <option value="TERMINATED">⛔ Đã chấm dứt</option>
          <option value="SUPERSEDED">🔄 Đã thay thế</option>
        </select>
      </div>
      <button type="button" data-op="loadHrpfReports" class="px-2.5 py-1.5 rounded text-xs font-bold bg-teal-700 text-white hover:bg-teal-800">🔍 Xem Báo Cáo</button>
    </div>
    <div id="hrpfReportBody" class="space-y-3"></div>
