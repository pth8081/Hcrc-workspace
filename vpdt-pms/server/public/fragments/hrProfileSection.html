
    <div class="flex flex-wrap items-center gap-2">
      <button type="button" id="btnHrpfViewMe" data-op="setHrProfileView" data-arg0="ME" class="px-2.5 py-1.5 rounded text-xs font-bold bg-teal-700 text-white">👤 Hồ Sơ Của Tôi</button>
      <button type="button" id="btnHrpfViewManage" data-op="setHrProfileView" data-arg0="MANAGE" class="hidden px-2.5 py-1.5 rounded text-xs font-bold bg-gray-200 text-gray-700 hover:bg-gray-300">📋 Quản Lý Hồ Sơ</button>
    </div>

    <!-- Hồ Sơ Của Tôi -->
    <div id="hrpfViewMe" class="space-y-3">
      <div id="hrpfMeNotFound" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 text-xs rounded p-3"></div>
      <div id="hrpfMeContainer" class="hidden bg-white border rounded-lg p-4 space-y-4"></div>

      <!-- Chỉ hiện với quyền hrProfileView (quản lý trực tiếp) — KHÔNG hiện cho hrProfileManage/admin (đã
           có màn "Quản Lý Hồ Sơ" đầy đủ hơn) lẫn nhân viên thường (không có quyền tra cứu người khác) —
           xem toggle trong renderHrProfileModule() (module-hrprofile.js). -->
      <div id="hrpfSubordinateSearchWrap" class="hidden pt-2 border-t mt-2">
        <p class="text-xs font-semibold text-gray-600 mb-1">🔍 Xem Hồ Sơ Nhân Viên (Quản Lý Trực Tiếp)</p>
        <div class="flex flex-wrap items-center gap-2">
          <input id="hrpfSubordinateInput" data-sdd-list="systemUsersDatalist" autocomplete="off" data-op-input="resolveHrpfSubordinateInput" data-arg-value="0" placeholder="Gõ tên/tài khoản nhân viên..." class="border p-1.5 rounded text-xs w-72 bg-white">
          <input type="hidden" id="hrpfSubordinateUsername">
          <button type="button" data-op="viewHrpfSubordinateProfile" class="px-2.5 py-1.5 rounded text-xs font-bold bg-blue-600 text-white hover:bg-blue-700">Xem</button>
        </div>
        <div id="hrpfSubordinateResult" class="hidden mt-2 bg-white border rounded-lg p-4"></div>
      </div>
    </div>

    <!-- Quản Lý Hồ Sơ (HR/admin, hoặc 1 trong 3 quyền chi tiết Tạo/Xem toàn bộ/Sửa — 9/2026) -->
    <div id="hrpfViewManage" class="hidden space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <input id="hrpfManageSearch" data-op-input="renderHrProfileManageList" autocomplete="off" placeholder="🔍 Tìm theo Mã NV / Họ tên / Tài khoản..." class="border p-1.5 rounded text-xs w-72 bg-white">
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" id="hrpfManageCreateBtn" data-op="openHrpfCreateModal" class="px-2.5 py-1.5 rounded text-xs font-bold bg-teal-700 text-white hover:bg-teal-800">➕ Tạo Hồ Sơ Mới</button>
          <button type="button" id="hrpfManageImportBtn" data-op="openHrpfImportModal" class="px-2.5 py-1.5 rounded text-xs font-bold bg-blue-600 text-white hover:bg-blue-700">📤 Nhập Excel</button>
          <a id="hrpfManageExportBtn" href="/api/hr-profile/export-xlsx" class="px-2.5 py-1.5 rounded text-xs font-bold bg-gray-600 text-white hover:bg-gray-700 inline-block">📊 Xuất Excel</a>
          <!-- CHỈ hrProfileManage/admin (khớp đúng quyền PUT /api/hr-profile/manager-field-config phía
               server, xem toggle trong renderHrProfileModule()). -->
          <button type="button" id="hrpfManageFieldConfigBtn" data-op="openHrpfManagerFieldConfigModal" class="px-2.5 py-1.5 rounded text-xs font-bold bg-amber-600 text-white hover:bg-amber-700">⚙️ Trường Xem Của Quản Lý Trực Tiếp</button>
          <!-- Đối xứng nút trên (9/2026, theo yêu cầu người dùng) — cấu hình field nhạy cảm nào chính chủ
               tự xem được ở "Hồ Sơ Của Tôi" (GET/PUT /api/hr-profile/self-field-config), CÙNG nguyên tắc
               opt-in mặc định KHÔNG field nào. -->
          <button type="button" id="hrpfSelfFieldConfigBtn" data-op="openHrpfSelfFieldConfigModal" class="px-2.5 py-1.5 rounded text-xs font-bold bg-amber-600 text-white hover:bg-amber-700">⚙️ Trường Xem Của Tôi</button>
        </div>
      </div>
      <!-- Chỉ ai có hrProfileFullView/hrProfileEdit/hrProfileManage/admin mới xem được danh sách — người
           CHỈ có hrProfileCreate (không có 3 quyền trên) không gọi GET / được (403), hiện thông báo này
           thay vì bảng trống/alert lỗi mỗi lần vào tab. -->
      <div id="hrpfManageNoListMsg" class="hidden bg-blue-50 border border-blue-200 text-blue-800 text-xs rounded p-3">
        ℹ️ Bạn chỉ có quyền <b>tạo mới</b> hồ sơ nhân sự — không xem được danh sách hồ sơ đã có. Dùng nút "➕ Tạo Hồ Sơ Mới" ở trên.
      </div>
      <div id="hrpfManageListWrap" class="overflow-x-auto bg-white border rounded-lg">
        <table class="w-full text-xs">
          <thead class="bg-gray-50 text-gray-600">
            <tr>
              <th class="p-2 text-left">Mã NV</th>
              <th class="p-2 text-left">Họ Tên</th>
              <th class="p-2 text-left">Phòng Ban / Chức Danh</th>
              <th class="p-2 text-left">Tài Khoản VPDT</th>
              <th class="p-2 text-left">Trạng Thái</th>
              <th class="p-2 text-left">Cập Nhật</th>
              <th class="p-2 text-left">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="hrpfManageTableBody"></tbody>
        </table>
        <p id="hrpfManageEmpty" class="hidden text-center text-gray-400 text-xs py-4">Chưa có hồ sơ nào.</p>
      </div>
    </div>
